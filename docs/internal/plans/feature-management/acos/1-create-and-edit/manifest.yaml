# Composed 2026-10-12 by /acos plan. The workers and slices are a suggestion; the part's orchestrator settles them at the start.
acos: "0.1"
id: 2026-10-12-feature-management-1-create-and-edit
part:
  plan: 2026-10-12-feature-management
  index: 1
  of: 2
  mode: sequential
  attendance: afk
  task: T-70
  base: main
  after: []
  assumes:
    - "main holds docs/internal/plans/feature-management.md and its prototype (the T-59 pull request is merged)."
    - "The desktop feature_create action takes exactly { name }, and no desktop action updates or deletes a feature."
    - "app/components/tasks/AddFeatureAction.tsx is the inline name form of the Board's filter row."
authorization: "Product owner, 2026-10-12: GO is given. This part runs unattended in the session of board task T-70, commits on that task's branch, and opens one pull request against main; it never merges. Workers do not commit. The pull request body lists the decisions taken, anything assumed, and the handoff for part 2."
intent: In the desktop app the owner creates a feature with a title, a description, and an app version, and edits those fields, from a Feature modal opened on the Board's filter row.
design:
  sources:
    - docs/internal/plans/feature-management/prototype.html
  contract: .agents/skills/acos/runs/2026-10-12-feature-management/artifacts/design-contract.md
scope:
  include:
    - server/tasks/
    - shared/task-contract.ts
    - server/serving/task-routes.mjs
    - app/api/tasks/
    - desktop/runtime/
    - app/components/tasks/
    - app/components/design-system/
    - app/styles/tasks.css
    - tests/server/tasks/
    - tests/desktop-task-action.test.mjs
    - tests/ui/
    - docs/internal/architecture/tasks.md
    - docs/internal/design/
    - docs/public/using-pomegr/tasks.md
  notes: "Decisions: docs/internal/plans/feature-management.md. Out of scope: the Queue view (to be removed), a Features list view, the agent feature tools, and Delete feature (part 2). Run artifacts go to .agents/skills/acos/runs/2026-10-12-feature-management/1-create-and-edit/ (git-ignored)."
stages:
  - name: contract
    block: contract
    adapter: inline
    inputs: [design]
    outputs: [design-contract]
    prompt: |
      Transcribe sections 1, 2, 3 and 5 of the prototype into numbered lines, one per
      element and state: the filter row in both states, the New feature form, the Feature
      form (header chip, fields, counters, helpers, the Tasks list, Save disabled and
      enabled), and the three failure lines. Leave out the footer's Delete feature action
      and section 4: part 2 builds them. The rules marked NEW in the prototype's style
      block are the styles this part adds; everything else is an existing class. Write
      the contract to
      .agents/skills/acos/runs/2026-10-12-feature-management/artifacts/design-contract.md.
    check:
      kind: review
      criteria: "Every element and state of sections 1, 2, 3 and 5 has a line with its class, size, tone and verbatim copy; no line covers Delete."
    on_fail: retry
  - name: plan
    block: plan
    adapter: inline
    inputs: [design-contract]
    outputs: [plan]
    prompt: |
      Read AGENTS.md, the Feature context, Boundaries and Privacy sections of
      docs/internal/architecture/tasks.md, docs/internal/design/task-modal.md, and the
      task rows of docs/internal/development/agent-workflow.md. Open the entry points
      that decide the seam: the action table at the end of server/tasks/task-store.mjs,
      server/tasks/task-feature-details.mjs, the action allowlist in
      desktop/runtime/task-action.mjs, and app/components/tasks/task-desktop.ts.

      Fix the interface between the two slices in both briefs, then write
      artifacts/plan.md with one section per slice:
      - the desktop action that creates a feature: { name } and, optionally, a
        description and an app version; { name } alone must keep working, because the
        task modal's inline name and the agent chat proposals send it;
      - the desktop action that updates a feature by ID: any of name, description and
        app version; an absent field stays as stored and a null description or app
        version clears it; a name another feature holds answers conflict;
      - the desktop-only read of one feature's description and app version, made when
        the modal opens. Choose the transport that keeps GET /api/tasks at
        { id, name, done } and gives a browser and a paired device nothing; say which in
        one line;
      - the TypeScript signatures the interface slice calls, and the fixed error names.
    check:
      kind: none
  - name: implement-monitor
    block: implement
    adapter: subagent
    provider: anthropic
    tier: balanced
    model: claude-sonnet-5-5
    effort: medium
    inputs: [plan]
    outputs: [implement-monitor-notes]
    owns:
      - server/tasks/
      - shared/task-contract.ts
      - server/serving/task-routes.mjs
      - app/api/tasks/
      - desktop/runtime/task-action.mjs
      - desktop/runtime/preload.cjs
      - tests/server/tasks/
      - tests/desktop-task-action.test.mjs
      - docs/internal/architecture/tasks.md
    prompt: |
      The user is away: never stop on a doubt; assume, record it, and go on. Another
      worker edits app/components/, app/styles/, tests/ui/ and docs/internal/design/ at
      the same time: write nothing outside your owns.

      Read your section of artifacts/plan.md, then AGENTS.md and the Feature context,
      Boundaries and Privacy sections of docs/internal/architecture/tasks.md.

      Build the monitor and desktop bridge side of the interface the plan fixes: the
      create action with the two optional fields, the update action, and the desktop-only
      read. Reuse task-feature-details.mjs and the validators of task-record.mjs; the
      bounds are in shared/task-contract.ts. The agent store actions and the four agent
      routes do not change. Add the actions to the fixed action lists the plan names and
      to no other channel: a paired device must still be refused.

      Tests: each action's success, conflict, limit, not_found and invalid answers; an
      update that leaves an absent field and clears a null one; a read by a client that
      is not the desktop app; and that GET /api/tasks and /api/state hold no description
      and no app version.

      Update docs/internal/architecture/tasks.md: Feature context (replace "Not in the
      desktop app yet"), the fixed IPC actions paragraph, the endpoint table, and Privacy,
      which must list the new read and who receives it.

      Keep every source file under 800 lines. Do not commit. Do not start a provider
      session. Save a short status with your decisions and the final signatures to
      .agents/skills/acos/runs/2026-10-12-feature-management/1-create-and-edit/artifacts/implement-monitor-notes.md
      and end with that path.
    check:
      kind: command
      command: 'node --experimental-strip-types --test "tests/server/tasks/*.test.mjs" && node --test tests/desktop-task-action.test.mjs && npm run check:boundaries'
    on_fail: retry
    max_iterations: 3
  - name: implement-interface
    block: implement
    adapter: subagent
    provider: anthropic
    tier: balanced
    model: claude-sonnet-5-5
    effort: high
    inputs: [plan, design-contract]
    outputs: [implement-interface-notes]
    owns:
      - app/components/tasks/
      - app/components/design-system/
      - app/styles/tasks.css
      - tests/ui/
      - docs/internal/design/task-modal.md
      - docs/internal/design/task-board.md
      - docs/public/using-pomegr/tasks.md
    prompt: |
      The user is away: never stop on a doubt; assume, record it, and go on. Another
      worker edits server/, shared/, desktop/, app/api/ and tests/server/ at the same
      time: write nothing outside your owns, and call the bridge only through the
      signatures your plan section gives.

      Read your section of artifacts/plan.md and the design contract, then AGENTS.md
      (User interface), DESIGN.md, docs/internal/design/task-modal.md, and
      docs/internal/design/task-board.md (Feature filter). Open
      docs/internal/plans/feature-management/prototype.html for placement.

      Build every contract line:
      - a Feature modal on TaskModalFrame in the modes New feature and Feature, with the
        fields, counters, helpers and copy of the contract. New: Create feature is
        disabled until the title holds text. Edit: a local draft read from the stored
        feature and the desktop read; Save is the one primary, disabled until the draft
        differs, and sends only what changed. The folded Tasks list reuses the In this
        feature list, and a row opens that task's modal. Scrim, Escape and focus follow
        the frame's rules: a form that holds something to save never closes on a scrim
        click. Draw no Delete feature action;
      - the Board's filter row: + New feature opens the modal and the inline name form
        goes; a Quiet Edit feature shows while one feature is chosen. With no feature
        yet, + New feature stays in the page header. The Queue view and the task modal's
        inline New feature… name do not change;
      - failures keep the modal open and what was typed, with one fixed line each;
      - no literal colour, off-scale radius or off-ramp font size in app/styles/.

      Add the Feature modal and the filter row states to /design-system as static
      chrome, update tests/ui/pomegr-design-contract.test.tsx, write the UI tests, and
      update docs/internal/design/task-modal.md (a Feature modal section and its
      footer rows), docs/internal/design/task-board.md (Feature filter, head actions),
      and docs/public/using-pomegr/tasks.md. One fact per bullet or table row.

      Keep every source file under 800 lines. Do not commit. Finish with the contract
      repeated, each line done <file:line> or deferred: <why>, and one capture line per
      contract line against http://localhost:3003/design-system. Save it to
      .agents/skills/acos/runs/2026-10-12-feature-management/1-create-and-edit/artifacts/implement-interface-notes.md
      and end with that path.
    check:
      kind: command
      command: "npx vitest run tests/ui/task tests/ui/pomegr-design-contract"
    on_fail: retry
    max_iterations: 3
  - name: verify
    block: verify
    adapter: inline
    check:
      kind: command
      command: "npm run verify:fast && npm run build && npm test"
    on_fail: retry
    max_iterations: 3
  - name: evidence
    block: evidence
    adapter: subagent
    provider: anthropic
    tier: balanced
    model: claude-sonnet-5-5
    effort: low
    inputs: [implement-interface-notes, design-contract]
    outputs: [try-it]
    prompt: |
      Start the dashboard with `npm run dev` in the background when
      http://localhost:3003 does not answer, and stop it when you finish. Capture every
      line of the interface notes with
      `node .agents/skills/acos/scripts/shot.mjs`, into
      .agents/skills/acos/runs/2026-10-12-feature-management/1-create-and-edit/artifacts/shots/,
      and compare each crop with its contract line. Write
      .agents/skills/acos/runs/2026-10-12-feature-management/1-create-and-edit/artifacts/try-it.md.
    check:
      kind: review
      criteria: "VERDICT: PASS, with every contract line match or deferred by name."
    on_fail: retry
    max_iterations: 2
limits:
  orchestrator_tokens: 120000
  worker_context_tokens: 200000
gates:
  go: required
estimate:
  files: 22
  deliverables: 7
  calibration: fallback
  confidence: low
  orchestrator: { startup_tokens: 40000, work_tokens: 35000, coordination_tokens: 10000, reserved_tokens: 85000, limit: 120000 }
  workers:
    - { stage: implement-monitor, class: semantic, files: 10, reserved_tokens: 140000, limit: 200000 }
    - { stage: implement-interface, class: semantic, files: 12, reserved_tokens: 160000, limit: 200000 }
    - { stage: evidence, class: evidence, reserved_tokens: 60000, limit: 200000 }
  aggregate_reserved_tokens: 445000
  observed_tokens: null
  agents: 3
  basis: "No calibration.md. Counts from globs, searches and line counts; files not opened end to end. Model ids are the aliases' current ids as named by the harness (sonnet: claude-sonnet-5-5). The interface slice carries design-contract lines, so it runs at high effort. Reservations, not usage."
