name: Windows CI diagnostics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Diagnostic label only; this workflow cannot publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Reproduce Windows dev replacement
        shell: pwsh
        run: |
          node --experimental-strip-types --test tests/dev-startup.test.mjs tests/codex-presence-responsiveness.test.mjs
          exit $LASTEXITCODE
