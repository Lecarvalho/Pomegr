# Project defaults for ACOS in Pomegr, derived by `/acos init`.
# Catalog files reference these with {{ project.* }}. No model ids here or
# in the catalog: stages ask for a tier, and compose writes the current id
# into the manifest.

acos: "0.1"

# Handoff verifier named in docs/AGENT-WORKFLOW.md ("Before handing off a change,
# run `npm run verify:fast`"). It chains lint, typecheck, contract/ops tests,
# provider-doc, architecture, and boundary checks. The full `npm run verify`
# (build, generated-artifact sync, node/UI/landing suites) stays CI's job.
verify: "npm run verify:fast"

# Captures the cropped screenshots a part's try-it page is built from;
# substituted into {{ project.shot }}. Headless Chrome or Edge, no dependencies.
# The dashboard must be running (`npm run dev`, http://localhost:3003).
shot: "node .agents/skills/acos/scripts/shot.mjs"

# Providers whose CLI is reachable on this machine (gemini, ollama absent).
providers:
  - anthropic
  - openai

# The Claude Code session's native provider and startup load. Tiers resolve
# through catalog/providers.yaml.
provider: anthropic
startup:
  orchestrator: 40000
  subagent: 27000
  basis: "estimated 2026-09-18 from Claude Code's loaded project and harness surface; no /context reading yet"

# A Codex session reads these in place of the top-level provider and startup.
harnesses:
  codex:
    provider: openai
    startup:
      orchestrator: 46000
      subagent: 29000
      basis: "estimated 2026-09-19 from Codex's loaded project, tool, MCP, and skill surface; separately estimated, not measured"

gates:
  go: required

# Session limits. Advisory, compose-time only: size tasks into slices, cap
# delegation. Not checked mid-run; /acos calibrate reports overruns.
limits:
  files: 8                       # per context: an inline part, or one slice of a
                                 # fan-out. A session running three slices
                                 # legitimately touches three times this.
  lines: 400                     # added plus removed, same per-context meaning
  orchestrator_tokens: 120000
  worker_context_tokens: 300000
  agents: 3
  stages: 5
