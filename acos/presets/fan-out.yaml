# Preset: fan-out
# Plan once in-session, then one balanced-tier implementer per disjoint
# slice, spawned together; verify the merged tree in-session; evidence in a
# balanced subagent while the handoff is written. Review is not here: in a
# plan it runs once near the end, over the whole diff.
#
# This is the shape to reach for before cutting another part: a worker costs
# its own startup on a cheaper tier and dies when it returns, while a part
# costs a whole session's startup plus a handoff written and read.
#
# The two implement entries are a shape, not a count: compose one per
# slice, each with a unique name and its own `owns`, up to limits.agents.
# Provider and model tiers come from .acos.yaml.

acos: "0.1"
name: fan-out
description: "Plan once, implement disjoint slices in parallel on the balanced tier, verify merged, capture evidence."

stages:
  - block: plan
    adapter: inline          # no effort: the session's is fixed

  - name: implement-a
    block: implement
    adapter: subagent
    model: "{{ project.models.balanced }}"
    effort: medium
    owns: []            # the slice's files; disjoint from every other implement stage
    on_fail: retry
    max_iterations: 2

  - name: implement-b
    block: implement
    adapter: subagent
    model: "{{ project.models.balanced }}"
    effort: medium
    owns: []
    on_fail: retry
    max_iterations: 2

  - block: verify
    adapter: inline
    on_fail: retry      # the orchestrator fixes seams between slices inline

  - block: evidence
    adapter: subagent
    model: "{{ project.models.balanced }}"
    effort: low
    on_fail: retry

loop:
  max_iterations: 3
  on_fail: retry

gates:
  go: required
