# Preset: plan-build-review
# Explore (cheap), plan in-session (strong), implement in a subagent
# (balanced, escalate to strong on failure), review in a subagent (strong).
# Provider and model come from .acos.yaml when omitted here.

acos: "0.1"
name: plan-build-review
description: "Explore, plan, implement with escalation, then independent review."

stages:
  - block: explore
    adapter: subagent
    effort: low
    model: "{{ project.models.fast }}"

  - block: plan
    adapter: inline
    effort: high

  - block: implement
    adapter: subagent
    effort: medium
    model: "{{ project.models.balanced }}"
    on_fail: escalate
    escalation:
      - { provider: "{{ project.provider }}", model: "{{ project.models.strong }}", effort: high }
    max_iterations: 3

  - block: review
    adapter: subagent
    effort: high
    model: "{{ project.models.strong }}"
    on_fail: ask

loop:
  max_iterations: 3
  on_fail: retry

gates:
  go: required
