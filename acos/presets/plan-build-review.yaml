# Preset: plan-build-review
# Plan in-session (strong), implement in-session (escalate to strong on
# failure), review in a subagent (strong) for an independent judgement.
# One agent total. Provider and model come from .acos.yaml when omitted.

acos: "0.1"
name: plan-build-review
description: "Plan, implement with escalation, then independent review."

stages:
  - block: plan
    adapter: inline
    effort: high

  - block: implement
    adapter: inline
    effort: medium
    on_fail: escalate
    escalation:
      - { provider: "{{ project.provider }}", model: "{{ project.models.strong }}", effort: high }
    max_iterations: 3

  - block: review
    adapter: subagent
    effort: high
    model: "{{ project.models.strong }}"
    on_fail: ask

loop:
  max_iterations: 3
  on_fail: retry

gates:
  go: required
