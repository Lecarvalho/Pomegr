name: evidence
role: "Show what the part changed: cropped screenshots of the running interface, captioned, in artifacts/try-it.md."
default:
  adapter: inline
  effort: low
inputs: [diff]
outputs: [try-it]
check:
  kind: none
prompt: |
  Write `runs/<id>/artifacts/try-it.md`: what a reader does to see this
  change, and a cropped screenshot of each claim they can check.

  Capture with:

      {{ project.shot }} --url <url> --selector <css> --pad 8 --out runs/<id>/artifacts/shots/<name>.png

  `--url` and `--out` are required, and exactly one of `--selector <css>`
  and `--full`. `--pad <n>` keeps a rounded border inside the frame.
  `--eval <js>` reaches a state no URL reaches, and `--wait-for <css>`
  waits for one that arrives late; `--selector` is polled until `--timeout`,
  so an element that only `--eval` creates needs no extra flag. `--width`,
  `--height` and `--dpr` size the viewport. A capture prints one line,
  `<path>  <W>x<H>  <bytes> bytes`, and exits 0; every failure prints one
  `shot: …` line and its own exit code.

  Then, per claim: one crop, `![alt](shots/<name>.png)`, one or two lines of
  caption saying what the crop shows and what is different about it. Prefer
  a crop of the one element over a full viewport the reader has to search.

  Open every PNG and look at it before you caption it. A crop that does not
  show what its caption says is a defect in this part: recapture it or
  change the claim. Do not caption a capture you have not seen.
