name: explore
role: "Map the parts of the codebase relevant to the intent. Read only. Use only when the area is unknown."
default:
  adapter: subagent
  model: "{{ project.models.balanced }}"
  effort: low
  # Delegated by default: a wide read whose result is one page. Reading the
  # area yourself spends the orchestrator budget the work still needs, and
  # the worker's context dies when it returns.
inputs: []
outputs: [context]
check:
  kind: none
prompt: |
  You are the explorer. Do not modify any file.

  Goal: find what the intent touches. Return a short report:
  - relevant files and directories, with one line each on why
  - existing conventions the change must follow (naming, tests, layout)
  - the verify command(s) this project uses, if you can find them
  - risks or unknowns

  Keep it under 40 lines. No code dumps.
